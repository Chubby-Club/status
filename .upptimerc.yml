# Chubby Club status page (CLUB-6562): status.chubbyclub.com.
# The sites sit behind Vercel Bot Protection (CLUB-6551), which challenges plain
# HTTP clients. Every check below uses a path the firewall's "bypass
# server-to-server callers" rule exempts (/api/health, /.well-known/*), or a
# site with no challenge, so a check fails only when the site does.
#
# The org keeps workflow tokens read-only by default and Upptime falls back to
# that token (no PAT), so each workflow declares contents/issues write itself.
# Setup, Update Template and Updates are disabled: they regenerate workflow
# files, which that token cannot push, and two run unpinned @master actions.
# To change workflows, edit them here by hand.
owner: Chubby-Club
repo: status

sites:
  - name: Chubby Club
    url: https://chubbyclub.com/
  - name: Join
    url: https://join.chubbyclub.com/api/health
  - name: Plus
    url: https://plus.chubbyclub.com/api/health
  - name: Sign-in service
    url: https://id.chubbyclub.com/.well-known/openid-configuration
  - name: Member profile
    url: https://my.chubbyclub.com/api/health
  - name: Reservations
    url: https://reserve.chubbyclub.com/api/health
  - name: Verification
    url: https://verify.chubbyclub.com/api/health
  - name: Promotions
    url: https://promo.chubbyclub.com/api/health
  - name: Create
    url: https://create.chubbyclub.com/api/health
  - name: Thank you
    url: https://ty.chubbyclub.com/api/health
  - name: Attend
    url: https://attend.chubbyclub.com/api/health
  - name: Partners
    url: https://partner.chubbyclub.com/api/health
  - name: Partner API
    url: https://api.chubbyclub.com/
  - name: Hub
    url: https://a5.chubbyclub.com/api/health
  - name: Legal
    url: https://legal.chubbyclub.com/api/health

status-website:
  cname: status.chubbyclub.com
  logoUrl: https://raw.githubusercontent.com/Chubby-Club/status/master/assets/logo.png
  name: Chubby Club Status
  theme: dark
  introTitle: "Chubby Club status"
  introMessage: Every Chubby Club site, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Chubby Club
      href: https://chubbyclub.com

# Notifications and issue assignment: https://upptime.js.org/docs/configuration
