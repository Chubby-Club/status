# Upptime treats every open issue labeled `maintenance` as a scheduled
# maintenance window: it hides outages for the listed sites and shows the
# issue on the status page. Only owners, org members and collaborators may
# declare one; this closes any other user's maintenance issue and removes the
# label. Hand-written (not generated by Upptime) and uses no third-party actions.
name: Maintenance guard
on:
  issues:
    types: [opened, labeled, reopened]
permissions: {}
concurrency:
  group: maintenance-guard-${{ github.event.issue.number }}
jobs:
  guard:
    if: >-
      contains(github.event.issue.labels.*.name, 'maintenance') &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove the label and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --remove-label maintenance
          gh issue close "$NUMBER" --reason "not planned" --comment "Only Chubby Club staff can schedule maintenance on this status page, so this issue was closed. To report a problem, open a bug report instead."
